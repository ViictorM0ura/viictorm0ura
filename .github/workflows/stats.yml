
name: GitHub Profile Dashboard

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate GitHub dashboard
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          import html
          import requests
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          API = "https://api.github.com"
          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = os.environ["GH_USERNAME"]
          OUT = Path("profile")
          OUT.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          })

          def get(url, params=None):
              response = session.get(
                  url, params=params, timeout=30
              )
              response.raise_for_status()
              return response.json()

          def graphql(query, variables):
              response = session.post(
                  f"{API}/graphql",
                  json={
                      "query": query,
                      "variables": variables
                  },
                  timeout=30
              )
              response.raise_for_status()
              data = response.json()

              if data.get("errors"):
                  raise RuntimeError(data["errors"])

              return data["data"]

          def esc(value):
              return html.escape(str(value))

          # Paleta visual
          BG = "#0D1117"
          PANEL = "#161B22"
          BORDER = "#30363D"
          TEXT = "#F0F6FC"
          MUTED = "#8B949E"
          BLUE = "#58A6FF"
          GREEN = "#3FB950"
          PURPLE = "#D2A8FF"
          ORANGE = "#F0883E"
          PINK = "#F778BA"
          CYAN = "#79C0FF"

          COLORS = [BLUE, GREEN, PURPLE, ORANGE, PINK, CYAN]

          now = datetime.now(timezone.utc)
          start = now - timedelta(days=365)

          user = get(f"{API}/user")
          login = user["login"]

          # --------------------------------------------------
          # 1. Repositórios acessíveis
          # --------------------------------------------------

          repos = []
          page = 1

          while True:
              batch = get(
                  f"{API}/user/repos",
                  {
                      "visibility": "all",
                      "affiliation": (
                          "owner,collaborator,organization_member"
                      ),
                      "per_page": 100,
                      "page": page,
                      "sort": "updated"
                  }
              )

              if not batch:
                  break

              repos.extend(batch)
              page += 1

          owned = [
              repo for repo in repos
              if repo.get("owner", {}).get("login", "").lower()
              == login.lower()
          ]

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in owned
          )

          forks = sum(
              repo.get("forks_count", 0)
              for repo in owned
          )

          public_repos = sum(
              not repo.get("private", False)
              for repo in owned
          )

          private_repos = sum(
              repo.get("private", False)
              for repo in owned
          )

          # --------------------------------------------------
          # 2. Contribuições dos últimos 12 meses
          # --------------------------------------------------

          contribution_query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
                totalRepositoriesWithContributedCommits
              }
            }
          }
          """

          data = graphql(
              contribution_query,
              {
                  "login": login,
                  "from": start.isoformat(),
                  "to": now.isoformat()
              }
          )

          contributions = (
              data["user"]["contributionsCollection"]
          )

          # --------------------------------------------------
          # 3. Merges realizados por você
          # --------------------------------------------------

          merges_by_user = 0
          merged_prs_checked = 0
          detail_errors = 0
          repos_with_pr_errors = 0

          for repo in repos:
              full_name = repo["full_name"]
              page = 1
              repo_error = False

              while True:
                  try:
                      prs = get(
                          f"{API}/repos/{full_name}/pulls",
                          {
                              "state": "closed",
                              "sort": "updated",
                              "direction": "desc",
                              "per_page": 100,
                              "page": page
                          }
                      )

                  except requests.HTTPError as error:
                      status = error.response.status_code

                      if status in (403, 404, 409):
                          repos_with_pr_errors += 1
                          repo_error = True
                          print(
                              f"PRs indisponíveis em {full_name}: "
                              f"HTTP {status}"
                          )
                          break

                      raise

                  if not prs:
                      break

                  stop_paging = False

                  for pr in prs:
                      updated_at = pr.get("updated_at")

                      if updated_at:
                          updated = datetime.fromisoformat(
                              updated_at.replace("Z", "+00:00")
                          )

                          if updated < start:
                              stop_paging = True
                              break

                      merged_at = pr.get("merged_at")

                      if not merged_at:
                          continue

                      merged_date = datetime.fromisoformat(
                          merged_at.replace("Z", "+00:00")
                      )

                      if not (start <= merged_date <= now):
                          continue

                      try:
                          details = get(
                              f"{API}/repos/{full_name}/pulls/"
                              f"{pr['number']}"
                          )

                          merged_prs_checked += 1
                          merger = details.get("merged_by") or {}

                          if (
                              merger.get("login", "").lower()
                              == login.lower()
                          ):
                              merges_by_user += 1

                      except requests.RequestException as error:
                          detail_errors += 1
                          print(
                              f"Erro no PR {full_name}#"
                              f"{pr['number']}: {error}"
                          )

                  if stop_paging or len(prs) < 100:
                      break

                  page += 1

          print(f"Repositórios acessíveis: {len(repos)}")
          print(f"PRs mergeados verificados: {merged_prs_checked}")
          print(f"Merges feitos por você: {merges_by_user}")
          print(f"Erros ao consultar detalhes: {detail_errors}")
          print(f"Repositórios com erros de acesso: {repos_with_pr_errors}")

          # --------------------------------------------------
          # 4. Linguagens dos projetos com commits seus
          # --------------------------------------------------

          language_totals = {}
          language_repos = 0
          language_errors = 0

          for repo in repos:
              full_name = repo["full_name"]

              try:
                  commits = get(
                      f"{API}/repos/{full_name}/commits",
                      {
                          "author": login,
                          "per_page": 1
                      }
                  )

                  if not commits:
                      continue

                  languages = get(
                      f"{API}/repos/{full_name}/languages"
                  )

                  if not languages:
                      continue

                  language_repos += 1

                  for language, size in languages.items():
                      language_totals[language] = (
                          language_totals.get(language, 0) + size
                      )

              except requests.HTTPError as error:
                  status = error.response.status_code

                  if status == 409:
                      print(f"Sem histórico de linguagens: {full_name}")
                      continue

                  language_errors += 1
                  print(
                      f"Erro HTTP {status} em {full_name}"
                  )

              except requests.RequestException as error:
                  language_errors += 1
                  print(f"Erro de linguagem em {full_name}: {error}")

          total_bytes = sum(language_totals.values())

          languages = sorted(
              language_totals.items(),
              key=lambda item: item[1],
              reverse=True
          )[:6]

          # --------------------------------------------------
          # 5. Montagem do dashboard único
          # --------------------------------------------------

          W, H = 1000, 610

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{W}" height="{H}" viewBox="0 0 {W} {H}">',
              f'<rect width="{W}" height="{H}" rx="20" fill="{BG}"/>',
              f'<rect x="1" y="1" width="{W-2}" height="{H-2}" '
              f'rx="19" fill="none" stroke="{BORDER}"/>',

              # Cabeçalho
              f'<text x="32" y="43" fill="{TEXT}" '
              'font-family="Segoe UI,Arial,sans-serif" '
              'font-size="23" font-weight="700">'
              'GitHub Dashboard</text>',

              f'<text x="32" y="67" fill="{MUTED}" '
              'font-family="Segoe UI,Arial,sans-serif" '
              'font-size="12">'
              'Desenvolvimento, colaboração e projetos</text>',

              f'<rect x="815" y="27" width="153" height="29" '
              f'rx="14.5" fill="{PANEL}" stroke="{BORDER}"/>',

              f'<circle cx="832" cy="41.5" r="4" fill="{GREEN}"/>',

              f'<text x="844" y="46" fill="{MUTED}" '
              'font-family="Segoe UI,Arial,sans-serif" '
              'font-size="10">ÚLTIMOS 12 MESES</text>',

              # Cards superiores
              f'<rect x="24" y="91" width="466" height="192" '
              f'rx="14" fill="{PANEL}" stroke="{BORDER}"/>',

              f'<rect x="510" y="91" width="466" height="192" '
              f'rx="14" fill="{PANEL}" stroke="{BORDER}"/>',

              f'<circle cx="48" cy="119" r="5" fill="{BLUE}"/>',

              f'<text x="62" y="124" fill="{TEXT}" '
              'font-family="Segoe UI,Arial,sans-serif" '
              'font-size="16" font-weight="600">GitHub Stats</text>',

              f'<text x="42" y="151" fill="{MUTED}" '
              'font-family="Segoe UI,Arial,sans-serif" '
              'font-size="11">Visão geral dos seus repositórios</text>',

              f'<circle cx="534" cy="119" r="5" fill="{GREEN}"/>',

              f'<text x="548" y="124" fill="{TEXT}" '
              'font-family="Segoe UI,Arial,sans-serif" '
              'font-size="16" font-weight="600">GitHub Activity</text>',

              f'<text x="528" y="151" fill="{MUTED}" '
              'font-family="Segoe UI,Arial,sans-serif" '
              'font-size="11">Desenvolvimento e colaboração</text>',
          ]

          def metric(x, y, label, value, color):
              svg.extend([
                  f'<text x="{x}" y="{y}" fill="{MUTED}" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="11">'
                  f'{esc(label)}</text>',

                  f'<text x="{x}" y="{y+27}" fill="{color}" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="23" font-weight="700">'
                  f'{esc(value)}</text>'
              ])

          # Stats: quatro indicadores
          metric(42, 181, "Estrelas recebidas", stars, BLUE)
          metric(260, 181, "Repositórios próprios", len(owned), PURPLE)
          metric(
              42, 230, "Públicos / privados",
              f"{public_repos} / {private_repos}", CYAN
          )
          metric(260, 230, "Forks recebidos", forks, ORANGE)

          # Activity: seis indicadores
          metric(
              528, 181, "Commits",
              contributions["totalCommitContributions"], BLUE
          )
          metric(
              676, 181, "PRs criados",
              contributions["totalPullRequestContributions"], PURPLE
          )
          metric(
              824, 181, "Code reviews",
              contributions["totalPullRequestReviewContributions"], CYAN
          )
          metric(528, 230, "Merges feitos por você", merges_by_user, GREEN)
          metric(
              676, 230, "Issues",
              contributions["totalIssueContributions"], ORANGE
          )
          metric(
              824, 230, "Repos com commits",
              contributions["totalRepositoriesWithContributedCommits"], PINK
          )

          # Card de linguagens
          svg.extend([
              f'<rect x="24" y="301" width="952" height="283" '
              f'rx="14" fill="{PANEL}" stroke="{BORDER}"/>',

              f'<circle cx="48" cy="330" r="5" fill="{PURPLE}"/>',

              f'<text x="62" y="335" fill="{TEXT}" '
              'font-family="Segoe UI,Arial,sans-serif" '
              'font-size="16" font-weight="600">'
              'GitHub Languages</text>',

              f'<text x="42" y="358" fill="{MUTED}" '
              'font-family="Segoe UI,Arial,sans-serif" '
              'font-size="11">'
              'Linguagens dos repositórios com commits atribuídos a você'
              '</text>'
          ])

          # Barra horizontal proporcional
          bar_x, bar_y, bar_w, bar_h = 42, 381, 916, 12

          svg.append(
              f'<rect x="{bar_x}" y="{bar_y}" '
              f'width="{bar_w}" height="{bar_h}" '
              f'rx="6" fill="{BORDER}"/>'
          )

          if total_bytes:
              cursor = bar_x

              for i, (name, size) in enumerate(languages):
                  segment = bar_w * size / total_bytes

                  if i == len(languages) - 1:
                      segment = bar_x + bar_w - cursor

                  svg.append(
                      f'<rect x="{cursor:.2f}" y="{bar_y}" '
                      f'width="{max(segment, 0):.2f}" '
                      f'height="{bar_h}" fill="{COLORS[i]}"/>'
                  )

                  cursor += segment

          # Legenda em três colunas
          for i, (name, size) in enumerate(languages):
              col = i % 3
              row = i // 3
              x = 42 + col * 310
              y = 432 + row * 62

              pct = size / total_bytes * 100 if total_bytes else 0

              svg.extend([
                  f'<circle cx="{x+5}" cy="{y-4}" r="5" '
                  f'fill="{COLORS[i]}"/>',

                  f'<text x="{x+18}" y="{y}" fill="{TEXT}" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="13" font-weight="600">'
                  f'{esc(name)}</text>',

                  f'<text x="{x+18}" y="{y+20}" fill="{MUTED}" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="11">'
                  f'{pct:.1f}%</text>',

                  f'<rect x="{x+18}" y="{y+29}" width="250" '
                  f'height="4" rx="2" fill="{BORDER}"/>',

                  f'<rect x="{x+18}" y="{y+29}" '
                  f'width="{250*pct/100:.2f}" height="4" '
                  f'rx="2" fill="{COLORS[i]}"/>'
              ])

          if not languages:
              svg.append(
                  f'<text x="42" y="425" fill="{MUTED}" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="12">'
                  'Nenhuma linguagem encontrada nos repositórios analisados.'
                  '</text>'
              )

          svg.extend([
              f'<text x="32" y="601" fill="{MUTED}" '
              'font-family="Segoe UI,Arial,sans-serif" '
              'font-size="10">'
              f'Dados consultados via GitHub API · {esc(login)}</text>',
              '</svg>'
          ])

          (OUT / "dashboard.svg").write_text(
              "\n".join(svg), encoding="utf-8"
          )

          print("Dashboard gerado: profile/dashboard.svg")
          print(f"Estrelas: {stars} | Repositórios próprios: {len(owned)}")
          print(
              f"Commits: {contributions['totalCommitContributions']} | "
              f"PRs: {contributions['totalPullRequestContributions']} | "
              f"Reviews: {contributions['totalPullRequestReviewContributions']} | "
              f"Merges feitos por você: {merges_by_user} | "
              f"Issues: {contributions['totalIssueContributions']}"
          )
          print(f"Repositórios com linguagens: {language_repos}")
          print(f"Erros de detalhes de PRs: {detail_errors}")
          print(f"Erros de linguagens: {language_errors}")
          PY

      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/dashboard.svg

          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub dashboard"
            git push
          fi
