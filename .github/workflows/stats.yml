
name: GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity and language cards
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          import requests
          import html
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = os.environ["GH_USERNAME"]
          API = "https://api.github.com"
          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          OUT = Path("profile")
          OUT.mkdir(exist_ok=True)

          def api_get(url, params=None):
              response = requests.get(
                  url, headers=HEADERS, params=params, timeout=30
              )
              response.raise_for_status()
              return response.json()

          def graphql(query, variables):
              response = requests.post(
                  "https://api.github.com/graphql",
                  headers=HEADERS,
                  json={"query": query, "variables": variables},
                  timeout=30
              )
              response.raise_for_status()
              data = response.json()
              if "errors" in data:
                  raise RuntimeError(data["errors"])
              return data["data"]

          def safe_text(value):
              return html.escape(str(value))

          def card(title, subtitle, metrics, footer, filename):
              width, height = 495, 260
              left, top = 24, 28
              colors = [
                  "#58A6FF", "#3FB950", "#D2A8FF",
                  "#F0883E", "#F778BA", "#79C0FF"
              ]

              svg = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" '
                  f'width="{width}" height="{height}" '
                  f'viewBox="0 0 {width} {height}">',
                  '<rect width="100%" height="100%" rx="12" '
                  'fill="#0D1117" stroke="#30363D"/>',
                  f'<text x="{left}" y="{top + 4}" fill="#F0F6FC" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="17" font-weight="600">'
                  f'{safe_text(title)}</text>',
                  f'<text x="{left}" y="{top + 25}" fill="#8B949E" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="11">'
                  f'{safe_text(subtitle)}</text>',
                  f'<line x1="{left}" y1="72" x2="{width-left}" y2="72" '
                  'stroke="#30363D"/>'
              ]

              positions = [
                  (24, 108), (260, 108),
                  (24, 163), (260, 163),
                  (24, 218), (260, 218)
              ]

              for i, (label, value) in enumerate(metrics[:6]):
                  x, y = positions[i]
                  color = colors[i]
                  svg.extend([
                      f'<circle cx="{x+5}" cy="{y-5}" r="4" '
                      f'fill="{color}"/>',
                      f'<text x="{x+17}" y="{y}" fill="#8B949E" '
                      'font-family="Segoe UI,Arial,sans-serif" '
                      'font-size="11">'
                      f'{safe_text(label)}</text>',
                      f'<text x="{x+17}" y="{y+22}" fill="#F0F6FC" '
                      'font-family="Segoe UI,Arial,sans-serif" '
                      'font-size="19" font-weight="600">'
                      f'{safe_text(value)}</text>'
                  ])

              svg.extend([
                  f'<text x="{left}" y="246" fill="#8B949E" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="10">'
                  f'{safe_text(footer)}</text>',
                  '</svg>'
              ])

              (OUT / filename).write_text(
                  "\n".join(svg), encoding="utf-8"
              )

          # --------------------------------------------------
          # 1. Atividade dos últimos 12 meses
          # --------------------------------------------------

          now = datetime.now(timezone.utc)
          start = now - timedelta(days=365)

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(
                from: $from,
                to: $to,
                includePrivateContributions: true
              ) {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
                totalRepositoryContributions
              }
            }
          }
          """

          result = graphql(query, {
              "login": USERNAME,
              "from": start.isoformat(),
              "to": now.isoformat()
          })

          contributions = result["user"]["contributionsCollection"]

          # Busca o total de PRs criados pelo usuário que foram
          # efetivamente integrados (merged) nos últimos 12 meses.
          merged_query = (
              f"is:pr is:merged author:{USERNAME} "
              f"merged:>={start.date().isoformat()} "
              f"merged:<={now.date().isoformat()}"
          )

          merged_data = api_get(
              f"{API}/search/issues",
              {"q": merged_query, "per_page": 1}
          )
          merged_prs = merged_data["total_count"]

          activity_metrics = [
              ("Commits", contributions["totalCommitContributions"]),
              ("PRs criados", contributions["totalPullRequestContributions"]),
              ("PRs integrados", merged_prs),
              ("Code reviews", contributions["totalPullRequestReviewContributions"]),
              ("Issues", contributions["totalIssueContributions"]),
              ("Repos contribuídos", contributions["totalRepositoryContributions"])
          ]

          card(
              "GitHub Activity",
              "Contribuicoes nos ultimos 12 meses",
              activity_metrics,
              f"Atualizado em {now.strftime('%d/%m/%Y')} UTC",
              "activity.svg"
          )

          print("Card de atividade gerado.")

          # --------------------------------------------------
          # 2. Linguagens dos repositórios com commits do autor
          # --------------------------------------------------

          repos = []
          page = 1

          while True:
              batch = api_get(
                  f"{API}/user/repos",
                  {
                      "visibility": "all",
                      "affiliation": "owner,collaborator,organization_member",
                      "per_page": 100,
                      "page": page,
                      "sort": "updated"
                  }
              )

              if not batch:
                  break

              repos.extend(batch)
              page += 1

          language_totals = {}
          repos_included = 0
          skipped = 0

          for repo in repos:
              full_name = repo["full_name"]

              try:
                  commits = api_get(
                      f"{API}/repos/{full_name}/commits",
                      {
                          "author": USERNAME,
                          "per_page": 1
                      }
                  )

                  if not commits:
                      continue

                  languages = api_get(
                      f"{API}/repos/{full_name}/languages"
                  )

                  if not languages:
                      continue

                  repos_included += 1

                  for language, byte_count in languages.items():
                      language_totals[language] = (
                          language_totals.get(language, 0) + byte_count
                      )

              except requests.RequestException:
                  skipped += 1
                  continue

          total_bytes = sum(language_totals.values())

          if total_bytes:
              sorted_languages = sorted(
                  language_totals.items(),
                  key=lambda item: item[1],
                  reverse=True
              )[:6]

              lang_metrics = [
                  (
                      name,
                      f"{value / total_bytes * 100:.1f}%"
                  )
                  for name, value in sorted_languages
              ]

              # Completa o card caso existam menos de seis linguagens.
              while len(lang_metrics) < 6:
                  lang_metrics.append((" ", " "))

          else:
              lang_metrics = [
                  ("Sem dados", "0%"),
                  (" ", " "), (" ", " "),
                  (" ", " "), (" ", " "), (" ", " ")
              ]

          card(
              "Most Used Languages",
              "Linguagens dos repositorios com seus commits",
              lang_metrics,
              f"{repos_included} repositorios analisados",
              "top-langs.svg"
          )

          print(f"Repositórios acessíveis: {len(repos)}")
          print(f"Repositórios com linguagens analisadas: {repos_included}")
          print(f"Repositórios ignorados por erro de API: {skipped}")
          print("Cards gerados com sucesso.")
          PY

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity.svg profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub profile stats"
            git push
          fi
