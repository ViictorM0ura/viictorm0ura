
name: GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity and language cards
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          import html
          import requests
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = os.environ["GH_USERNAME"]
          API = "https://api.github.com"
          OUT = Path("profile")
          OUT.mkdir(exist_ok=True)

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, params=None):
              response = session.get(url, params=params, timeout=30)
              response.raise_for_status()
              return response.json()

          def graphql(query, variables):
              response = session.post(
                  f"{API}/graphql",
                  json={"query": query, "variables": variables},
                  timeout=30
              )
              response.raise_for_status()
              data = response.json()

              if data.get("errors"):
                  raise RuntimeError(data["errors"])

              return data["data"]

          def search_count(query):
              data = get(
                  f"{API}/search/issues",
                  {"q": query, "per_page": 1}
              )
              return data["total_count"]

          def esc(value):
              return html.escape(str(value))

          def draw_card(title, subtitle, metrics, footer, filename):
              width, height = 495, 260
              colors = [
                  "#58A6FF", "#3FB950", "#D2A8FF",
                  "#F0883E", "#F778BA", "#79C0FF"
              ]

              positions = [
                  (24, 108), (260, 108),
                  (24, 163), (260, 163),
                  (24, 218), (260, 218)
              ]

              svg = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" '
                  f'width="{width}" height="{height}" '
                  f'viewBox="0 0 {width} {height}">',
                  '<rect width="100%" height="100%" rx="12" '
                  'fill="#0D1117" stroke="#30363D"/>',
                  f'<text x="24" y="32" fill="#F0F6FC" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="17" font-weight="600">'
                  f'{esc(title)}</text>',
                  f'<text x="24" y="53" fill="#8B949E" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="11">'
                  f'{esc(subtitle)}</text>',
                  '<line x1="24" y1="72" x2="471" y2="72" '
                  'stroke="#30363D"/>'
              ]

              for index, (label, value) in enumerate(metrics[:6]):
                  x, y = positions[index]
                  color = colors[index]

                  svg.extend([
                      f'<circle cx="{x+5}" cy="{y-5}" r="4" '
                      f'fill="{color}"/>',
                      f'<text x="{x+17}" y="{y}" fill="#8B949E" '
                      'font-family="Segoe UI,Arial,sans-serif" '
                      'font-size="11">'
                      f'{esc(label)}</text>',
                      f'<text x="{x+17}" y="{y+22}" fill="#F0F6FC" '
                      'font-family="Segoe UI,Arial,sans-serif" '
                      'font-size="19" font-weight="600">'
                      f'{esc(value)}</text>'
                  ])

              svg.extend([
                  f'<text x="24" y="246" fill="#8B949E" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="10">{esc(footer)}</text>',
                  '</svg>'
              ])

              (OUT / filename).write_text(
                  "\n".join(svg), encoding="utf-8"
              )

          # Período analisado: últimos 12 meses.
          now = datetime.now(timezone.utc)
          start = now - timedelta(days=365)
          since = start.strftime("%Y-%m-%d")
          until = now.strftime("%Y-%m-%d")

          # Contribuições: commits, PRs criados, reviews e issues.
          # read:user permite incluir contribuições privadas na coleção,
          # conforme as configurações e permissões do GitHub.
          contribution_query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
                totalRepositoriesWithContributedCommits
              }
            }
          }
          """

          result = graphql(contribution_query, {
              "login": USERNAME,
              "from": start.isoformat(),
              "to": now.isoformat()
          })

          contributions = result["user"]["contributionsCollection"]

          # PRs efetivamente integrados por você, incluindo PRs
          # abertos por colegas, quando o GitHub registra seu usuário
          # como responsável pelo merge.
          merged_by_you = search_count(
              f"is:pr is:merged merged-by:{USERNAME} "
              f"merged:>={since} merged:<={until}"
          )

          activity = [
              ("Commits", contributions["totalCommitContributions"]),
              ("PRs criados", contributions["totalPullRequestContributions"]),
              ("Reviews enviados", contributions["totalPullRequestReviewContributions"]),
              ("Merges por você", merged_by_you),
              ("Issues abertas", contributions["totalIssueContributions"]),
              ("Repos com commits", contributions["totalRepositoriesWithContributedCommits"])
          ]

          draw_card(
              "GitHub Activity",
              "Desenvolvimento e colaboracao | ultimos 12 meses",
              activity,
              f"Atualizado em {now.strftime('%d/%m/%Y')} UTC",
              "activity.svg"
          )

          print("Card de atividade gerado.")

          # Linguagens dos repositórios acessíveis nos quais você
          # possui pelo menos um commit atribuído à sua conta.
          repos = []
          page = 1

          while True:
              batch = get(
                  f"{API}/user/repos",
                  {
                      "visibility": "all",
                      "affiliation": "owner,collaborator,organization_member",
                      "per_page": 100,
                      "page": page,
                      "sort": "updated"
                  }
              )

              if not batch:
                  break

              repos.extend(batch)
              page += 1

          language_totals = {}
          repos_included = 0
          skipped = 0

          for repo in repos:
              full_name = repo["full_name"]

              try:
                  commits = get(
                      f"{API}/repos/{full_name}/commits",
                      {"author": USERNAME, "per_page": 1}
                  )

                  if not commits:
                      continue

                  languages = get(
                      f"{API}/repos/{full_name}/languages"
                  )

                  if not languages:
                      continue

                  repos_included += 1

                  for language, byte_count in languages.items():
                      language_totals[language] = (
                          language_totals.get(language, 0) + byte_count
                      )

              except requests.RequestException as error:
                  skipped += 1
                  print(f"Aviso: falha ao analisar {full_name}: {error}")
                  continue

          total_bytes = sum(language_totals.values())

          if total_bytes:
              ranked = sorted(
                  language_totals.items(),
                  key=lambda item: item[1],
                  reverse=True
              )[:6]

              language_metrics = [
                  (name, f"{amount / total_bytes * 100:.1f}%")
                  for name, amount in ranked
              ]
          else:
              language_metrics = []

          while len(language_metrics) < 6:
              language_metrics.append(("Sem dados", "0%"))

          draw_card(
              "Most Used Languages",
              "Linguagens dos repositorios com seus commits",
              language_metrics,
              f"{repos_included} repositorios analisados",
              "top-langs.svg"
          )

          print(f"Repositórios acessíveis: {len(repos)}")
          print(f"Repositórios com linguagens: {repos_included}")
          print(f"Repositórios com erros: {skipped}")
          print("Cards gerados com sucesso.")
          PY

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity.svg profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub profile stats"
            git push
          fi
