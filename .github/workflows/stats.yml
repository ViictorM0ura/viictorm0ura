
name: GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate GitHub profile cards
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          import html
          import requests
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = os.environ["GH_USERNAME"]
          API = "https://api.github.com"
          OUT = Path("profile")
          OUT.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          })

          def get(url, params=None):
              response = session.get(
                  url, params=params, timeout=30
              )
              response.raise_for_status()
              return response.json()

          def graphql(query, variables):
              response = session.post(
                  f"{API}/graphql",
                  json={
                      "query": query,
                      "variables": variables
                  },
                  timeout=30
              )
              response.raise_for_status()
              result = response.json()

              if result.get("errors"):
                  raise RuntimeError(result["errors"])

              return result["data"]

          def esc(value):
              return html.escape(str(value))

          def draw_card(title, subtitle, metrics, filename):
              width, height = 495, 260

              colors = [
                  "#58A6FF", "#3FB950", "#D2A8FF",
                  "#F0883E", "#F778BA", "#79C0FF"
              ]

              positions = [
                  (24, 108), (260, 108),
                  (24, 163), (260, 163),
                  (24, 218), (260, 218)
              ]

              svg = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" '
                  f'width="{width}" height="{height}" '
                  f'viewBox="0 0 {width} {height}">',
                  '<rect x="0.5" y="0.5" width="494" height="259" '
                  'rx="12" fill="#0D1117" stroke="#30363D"/>',
                  '<text x="24" y="32" fill="#F0F6FC" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="17" font-weight="600">'
                  f'{esc(title)}</text>',
                  '<text x="24" y="53" fill="#8B949E" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="11">'
                  f'{esc(subtitle)}</text>',
                  '<line x1="24" y1="72" x2="471" y2="72" '
                  'stroke="#30363D"/>'
              ]

              for index, (label, value) in enumerate(metrics[:6]):
                  x, y = positions[index]

                  svg.extend([
                      f'<circle cx="{x+5}" cy="{y-5}" r="4" '
                      f'fill="{colors[index]}"/>',
                      f'<text x="{x+17}" y="{y}" fill="#8B949E" '
                      'font-family="Segoe UI,Arial,sans-serif" '
                      'font-size="11">'
                      f'{esc(label)}</text>',
                      f'<text x="{x+17}" y="{y+22}" fill="#F0F6FC" '
                      'font-family="Segoe UI,Arial,sans-serif" '
                      'font-size="19" font-weight="600">'
                      f'{esc(value)}</text>'
                  ])

              # Sem rodapé para manter o card limpo.
              svg.append("</svg>")

              (OUT / filename).write_text(
                  "\n".join(svg), encoding="utf-8"
              )

          now = datetime.now(timezone.utc)
          start = now - timedelta(days=365)
          since = start.strftime("%Y-%m-%d")
          until = now.strftime("%Y-%m-%d")

          # --------------------------------------------------
          # 1. Perfil e repositórios acessíveis
          # --------------------------------------------------

          user = get(f"{API}/user")
          login = user["login"]

          repos = []
          page = 1

          while True:
              batch = get(
                  f"{API}/user/repos",
                  {
                      "visibility": "all",
                      "affiliation": (
                          "owner,collaborator,organization_member"
                      ),
                      "per_page": 100,
                      "page": page,
                      "sort": "updated"
                  }
              )

              if not batch:
                  break

              repos.extend(batch)
              page += 1

          owned_repos = [
              repo for repo in repos
              if repo.get("owner", {}).get("login", "").lower()
              == login.lower()
          ]

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in owned_repos
          )

          forks = sum(
              repo.get("forks_count", 0)
              for repo in owned_repos
          )

          public_repos = sum(
              1 for repo in owned_repos
              if not repo.get("private", False)
          )

          private_repos = sum(
              1 for repo in owned_repos
              if repo.get("private", False)
          )

          draw_card(
              "GitHub Stats",
              "Visao geral dos seus repositorios",
              [
                  ("Estrelas recebidas", stars),
                  ("Repositorios proprios", len(owned_repos)),
                  ("Repos publicos", public_repos),
                  ("Repos privados", private_repos),
                  ("Forks recebidos", forks),
                  ("Seguidores", user.get("followers", 0))
              ],
              "stats.svg"
          )

          print("Card geral gerado.")

          # --------------------------------------------------
          # 2. Contribuições reconhecidas pelo GitHub
          # --------------------------------------------------

          contribution_query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
                totalRepositoriesWithContributedCommits
              }
            }
          }
          """

          data = graphql(contribution_query, {
              "login": login,
              "from": start.isoformat(),
              "to": now.isoformat()
          })

          contributions = (
              data["user"]["contributionsCollection"]
          )

          # --------------------------------------------------
          # 3. Merges realizados por você
          # --------------------------------------------------

          merged_by_you = 0
          merged_prs_checked = 0
          detail_errors = 0
          inaccessible_repos = 0
          repos_checked_for_merges = 0

          for repo in repos:
              full_name = repo["full_name"]
              page = 1
              repo_has_error = False

              while True:
                  try:
                      pull_requests = get(
                          f"{API}/repos/{full_name}/pulls",
                          {
                              "state": "closed",
                              "sort": "updated",
                              "direction": "desc",
                              "per_page": 100,
                              "page": page
                          }
                      )

                  except requests.HTTPError as error:
                      status = error.response.status_code

                      if status in (403, 404, 409):
                          inaccessible_repos += 1
                          repo_has_error = True
                          print(
                              f"Aviso ao consultar PRs de "
                              f"{full_name}: HTTP {status}"
                          )
                          break

                      raise

                  if not pull_requests:
                      break

                  stop_paging = False

                  for pr in pull_requests:
                      updated_at = pr.get("updated_at")

                      if updated_at:
                          updated_date = datetime.fromisoformat(
                              updated_at.replace("Z", "+00:00")
                          )

                          # A listagem está ordenada pela atualização.
                          # Se já ultrapassamos o período, encerramos
                          # a paginação desse repositório.
                          if updated_date < start:
                              stop_paging = True
                              break

                      merged_at = pr.get("merged_at")

                      if not merged_at:
                          continue

                      merged_date = datetime.fromisoformat(
                          merged_at.replace("Z", "+00:00")
                      )

                      if not (start <= merged_date <= now):
                          continue

                      number = pr["number"]

                      try:
                          # IMPORTANTE: consulta individual do PR.
                          # É nesta resposta que verificamos merged_by.
                          details = get(
                              f"{API}/repos/{full_name}/pulls/{number}"
                          )

                          merged_prs_checked += 1
                          merger = details.get("merged_by") or {}
                          merger_login = merger.get("login", "")

                          if merger_login.lower() == login.lower():
                              merged_by_you += 1
                              print(
                                  f"Merge seu confirmado: "
                                  f"{full_name}#{number}"
                              )

                      except requests.RequestException as error:
                          detail_errors += 1
                          print(
                              f"Erro ao verificar "
                              f"{full_name}#{number}: {error}"
                          )

                  if stop_paging or len(pull_requests) < 100:
                      break

                  page += 1

              if not repo_has_error:
                  repos_checked_for_merges += 1

          print(f"Repositórios acessíveis: {len(repos)}")
          print(
              f"Repositórios verificados para merges: "
              f"{repos_checked_for_merges}"
          )
          print(f"PRs mergeados detalhados: {merged_prs_checked}")
          print(f"Falhas ao consultar detalhes: {detail_errors}")
          print(f"Repositórios sem acesso aos PRs: {inaccessible_repos}")
          print(f"Merges realizados por você: {merged_by_you}")

          # --------------------------------------------------
          # 4. Card de atividade profissional
          # --------------------------------------------------

          draw_card(
              "GitHub Activity",
              "Desenvolvimento e colaboracao | ultimos 12 meses",
              [
                  (
                      "Commits",
                      contributions["totalCommitContributions"]
                  ),
                  (
                      "PRs criados",
                      contributions["totalPullRequestContributions"]
                  ),
                  (
                      "Reviews enviados",
                      contributions["totalPullRequestReviewContributions"]
                  ),
                  ("Merges por você", merged_by_you),
                  (
                      "Issues",
                      contributions["totalIssueContributions"]
                  ),
                  (
                      "Repos com commits",
                      contributions[
                          "totalRepositoriesWithContributedCommits"
                      ]
                  )
              ],
              "activity.svg"
          )

          # --------------------------------------------------
          # 5. Linguagens dos repositórios com commits seus
          # --------------------------------------------------

          language_totals = {}
          repos_included = 0
          skipped = 0

          for repo in repos:
              full_name = repo["full_name"]

              try:
                  commits = get(
                      f"{API}/repos/{full_name}/commits",
                      {
                          "author": login,
                          "per_page": 1
                      }
                  )

                  if not commits:
                      continue

                  languages = get(
                      f"{API}/repos/{full_name}/languages"
                  )

                  if not languages:
                      continue

                  repos_included += 1

                  for language, byte_count in languages.items():
                      language_totals[language] = (
                          language_totals.get(language, 0)
                          + byte_count
                      )

              except requests.HTTPError as error:
                  status = error.response.status_code

                  if status == 409:
                      print(f"Sem histórico consultável: {full_name}")
                      continue

                  skipped += 1
                  print(f"Aviso HTTP {status}: {full_name}")

              except requests.RequestException as error:
                  skipped += 1
                  print(
                      f"Aviso de conexão em {full_name}: {error}"
                  )

          total_bytes = sum(language_totals.values())

          if total_bytes:
              ranked = sorted(
                  language_totals.items(),
                  key=lambda item: item[1],
                  reverse=True
              )[:6]

              language_metrics = [
                  (
                      language,
                      f"{size / total_bytes * 100:.1f}%"
                  )
                  for language, size in ranked
              ]
          else:
              language_metrics = []

          while len(language_metrics) < 6:
              language_metrics.append(("Sem dados", "0%"))

          draw_card(
              "Most Used Languages",
              "Linguagens dos repositorios com seus commits",
              language_metrics,
              "top-langs.svg"
          )

          print(f"Repos analisados para linguagens: {repos_included}")
          print(f"Outros erros de linguagens: {skipped}")
          print("Todos os cards foram gerados.")
          PY

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/activity.svg profile/top-langs.svg

          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub profile stats"
            git push
          fi
