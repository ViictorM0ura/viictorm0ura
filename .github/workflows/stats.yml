
name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose private repository access
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Authenticated GitHub user ==="
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user |
            jq '{login, type}'

          echo "=== Private repositories accessible to token ==="
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/repos?visibility=private&affiliation=owner,collaborator,organization_member&per_page=100" \
            > /tmp/repos.json

          jq '{
            private_repositories_in_response: [.[] | select(.private == true)] | length,
            tld_teledata_private_repositories: [.[] | select(.private == true and (.owner.login | ascii_downcase) == "tld-teledata")] | length,
            pagination_note: "The response contains at most 100 repositories"
          }' /tmp/repos.json

          echo "=== TLD-TeleData organization API ==="
          status=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/org.json \
            -w "%{http_code}" \
            https://api.github.com/orgs/TLD-TeleData)

          echo "Organization API HTTP status: $status"
          jq '{login, message}' /tmp/org.json

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&locale=pt-br
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub stats" || exit 0
          git push
