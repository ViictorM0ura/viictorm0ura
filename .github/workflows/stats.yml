
name: GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate GitHub profile cards
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          import html
          import requests
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = os.environ["GH_USERNAME"]
          API = "https://api.github.com"
          OUT = Path("profile")
          OUT.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          })

          def get(url, params=None):
              response = session.get(url, params=params, timeout=30)
              response.raise_for_status()
              return response.json()

          def graphql(query, variables):
              response = session.post(
                  f"{API}/graphql",
                  json={"query": query, "variables": variables},
                  timeout=30
              )
              response.raise_for_status()
              result = response.json()

              if result.get("errors"):
                  raise RuntimeError(result["errors"])

              return result["data"]

          def esc(value):
              return html.escape(str(value))

          BG = "#0D1117"
          BORDER = "#30363D"
          TITLE = "#F0F6FC"
          MUTED = "#8B949E"
          ACCENTS = [
              "#58A6FF", "#3FB950", "#D2A8FF",
              "#F0883E", "#F778BA", "#79C0FF"
          ]

          def draw_card(title, subtitle, metrics, filename):
              width, height = 495, 260

              positions = [
                  (24, 108), (260, 108),
                  (24, 163), (260, 163),
                  (24, 218), (260, 218)
              ]

              svg = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" '
                  f'width="{width}" height="{height}" '
                  f'viewBox="0 0 {width} {height}">',
                  f'<rect x="0.5" y="0.5" width="494" height="259" '
                  f'rx="14" fill="{BG}" stroke="{BORDER}"/>',
                  f'<text x="24" y="33" fill="{TITLE}" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="17" font-weight="600">'
                  f'{esc(title)}</text>',
                  f'<text x="24" y="54" fill="{MUTED}" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="11">'
                  f'{esc(subtitle)}</text>',
                  f'<line x1="24" y1="73" x2="471" y2="73" '
                  f'stroke="{BORDER}"/>'
              ]

              for index, (label, value) in enumerate(metrics[:6]):
                  x, y = positions[index]

                  svg.extend([
                      f'<circle cx="{x+5}" cy="{y-5}" r="4" '
                      f'fill="{ACCENTS[index]}"/>',
                      f'<text x="{x+17}" y="{y}" fill="{MUTED}" '
                      'font-family="Segoe UI,Arial,sans-serif" '
                      'font-size="11">'
                      f'{esc(label)}</text>',
                      f'<text x="{x+17}" y="{y+22}" fill="{TITLE}" '
                      'font-family="Segoe UI,Arial,sans-serif" '
                      'font-size="19" font-weight="600">'
                      f'{esc(value)}</text>'
                  ])

              svg.append("</svg>")
              (OUT / filename).write_text(
                  "\n".join(svg), encoding="utf-8"
              )

          def draw_languages(language_totals, filename):
              width, height = 990, 184
              total = sum(language_totals.values())

              ranked = sorted(
                  language_totals.items(),
                  key=lambda item: item[1],
                  reverse=True
              )[:6]

              svg = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" '
                  f'width="{width}" height="{height}" '
                  f'viewBox="0 0 {width} {height}">',
                  f'<rect x="0.5" y="0.5" width="989" height="183" '
                  f'rx="14" fill="{BG}" stroke="{BORDER}"/>',
                  f'<text x="26" y="32" fill="{TITLE}" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="17" font-weight="600">'
                  'Linguagens mais utilizadas</text>',
                  f'<text x="26" y="52" fill="{MUTED}" '
                  'font-family="Segoe UI,Arial,sans-serif" '
                  'font-size="11">'
                  'Distribuicao das linguagens nos repositorios com seus commits'
                  '</text>'
              ]

              bar_x = 26
              bar_y = 68
              bar_w = 938
              bar_h = 9

              svg.append(
                  f'<rect x="{bar_x}" y="{bar_y}" '
                  f'width="{bar_w}" height="{bar_h}" '
                  f'rx="4.5" fill="{BORDER}"/>'
              )

              current_x = bar_x

              if total:
                  for index, (language, amount) in enumerate(ranked):
                      segment_w = bar_w * amount / total

                      if index == len(ranked) - 1:
                          segment_w = bar_x + bar_w - current_x

                      svg.append(
                          f'<rect x="{current_x:.2f}" y="{bar_y}" '
                          f'width="{max(segment_w, 0):.2f}" '
                          f'height="{bar_h}" fill="{ACCENTS[index]}"/>'
                      )
                      current_x += segment_w

              # Legenda distribuída em três colunas.
              for index, (language, amount) in enumerate(ranked):
                  column = index % 3
                  row = index // 3
                  x = 28 + column * 315
                  y = 111 + row * 37
                  percent = amount / total * 100 if total else 0

                  svg.extend([
                      f'<circle cx="{x+5}" cy="{y-4}" r="4" '
                      f'fill="{ACCENTS[index]}"/>',
                      f'<text x="{x+17}" y="{y}" fill="{TITLE}" '
                      'font-family="Segoe UI,Arial,sans-serif" '
                      'font-size="12" font-weight="500">'
                      f'{esc(language)}</text>',
                      f'<text x="{x+295}" y="{y}" fill="{MUTED}" '
                      'font-family="Segoe UI,Arial,sans-serif" '
                      'font-size="12" text-anchor="end">'
                      f'{percent:.1f}%</text>'
                  ])

              if not ranked:
                  svg.append(
                      f'<text x="28" y="112" fill="{MUTED}" '
                      'font-family="Segoe UI,Arial,sans-serif" '
                      'font-size="12">Nenhum dado de linguagem encontrado</text>'
                  )

              svg.append("</svg>")
              (OUT / filename).write_text(
                  "\n".join(svg), encoding="utf-8"
              )

          now = datetime.now(timezone.utc)
          start = now - timedelta(days=365)
          since = start.strftime("%Y-%m-%d")
          until = now.strftime("%Y-%m-%d")

          # --------------------------------------------------
          # 1. Perfil e repositórios acessíveis
          # --------------------------------------------------

          user = get(f"{API}/user")
          login = user["login"]

          repos = []
          page = 1

          while True:
              batch = get(
                  f"{API}/user/repos",
                  {
                      "visibility": "all",
                      "affiliation": (
                          "owner,collaborator,organization_member"
                      ),
                      "per_page": 100,
                      "page": page,
                      "sort": "updated"
                  }
              )

              if not batch:
                  break

              repos.extend(batch)
              page += 1

          owned_repos = [
              repo for repo in repos
              if repo.get("owner", {}).get("login", "").lower()
              == login.lower()
          ]

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in owned_repos
          )

          forks = sum(
              repo.get("forks_count", 0)
              for repo in owned_repos
          )

          public_repos = sum(
              1 for repo in owned_repos
              if not repo.get("private", False)
          )

          private_repos = sum(
              1 for repo in owned_repos
              if repo.get("private", False)
          )

          draw_card(
              "Visao geral",
              "Seu perfil e seus projetos",
              [
                  ("Estrelas recebidas", stars),
                  ("Repositorios proprios", len(owned_repos)),
                  ("Repos publicos", public_repos),
                  ("Repos privados", private_repos),
                  ("Forks recebidos", forks),
                  ("Seguidores", user.get("followers", 0))
              ],
              "stats.svg"
          )

          print("Card geral gerado.")

          # --------------------------------------------------
          # 2. Contribuições do último ano
          # --------------------------------------------------

          contribution_query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
                totalRepositoriesWithContributedCommits
              }
            }
          }
          """

          data = graphql(contribution_query, {
              "login": login,
              "from": start.isoformat(),
              "to": now.isoformat()
          })

          contributions = (
              data["user"]["contributionsCollection"]
          )

          # --------------------------------------------------
          # 3. Merges realizados por você
          # --------------------------------------------------

          merged_by_you = 0
          merged_prs_checked = 0
          detail_errors = 0
          inaccessible_repos = 0
          repos_checked_for_merges = 0

          for repo in repos:
              full_name = repo["full_name"]
              page = 1
              repo_has_error = False

              while True:
                  try:
                      pull_requests = get(
                          f"{API}/repos/{full_name}/pulls",
                          {
                              "state": "closed",
                              "sort": "updated",
                              "direction": "desc",
                              "per_page": 100,
                              "page": page
                          }
                      )

                  except requests.HTTPError as error:
                      status = error.response.status_code

                      if status in (403, 404, 409):
                          inaccessible_repos += 1
                          repo_has_error = True
                          print(
                              f"Aviso ao consultar PRs de "
                              f"{full_name}: HTTP {status}"
                          )
                          break

                      raise

                  if not pull_requests:
                      break

                  stop_paging = False

                  for pr in pull_requests:
                      updated_at = pr.get("updated_at")

                      if updated_at:
                          updated_date = datetime.fromisoformat(
                              updated_at.replace("Z", "+00:00")
                          )

                          if updated_date < start:
                              stop_paging = True
                              break

                      merged_at = pr.get("merged_at")

                      if not merged_at:
                          continue

                      merged_date = datetime.fromisoformat(
                          merged_at.replace("Z", "+00:00")
                      )

                      if not (start <= merged_date <= now):
                          continue

                      number = pr["number"]

                      try:
                          details = get(
                              f"{API}/repos/{full_name}/pulls/{number}"
                          )
                          merged_prs_checked += 1

                          merger = details.get("merged_by") or {}

                          if merger.get("login", "").lower() == login.lower():
                              merged_by_you += 1

                      except requests.RequestException as error:
                          detail_errors += 1
                          print(
                              f"Erro ao verificar "
                              f"{full_name}#{number}: {error}"
                          )

                  if stop_paging or len(pull_requests) < 100:
                      break

                  page += 1

              if not repo_has_error:
                  repos_checked_for_merges += 1

          print(f"Repositórios acessíveis: {len(repos)}")
          print(
              f"Repositórios verificados para merges: "
              f"{repos_checked_for_merges}"
          )
          print(f"PRs mergeados detalhados: {merged_prs_checked}")
          print(f"Falhas ao consultar detalhes: {detail_errors}")
          print(f"Repositórios sem acesso: {inaccessible_repos}")
          print(f"Merges realizados por você: {merged_by_you}")

          draw_card(
              "Atividade no GitHub",
              "Desenvolvimento e colaboracao | ultimos 12 meses",
              [
                  (
                      "Commits",
                      contributions["totalCommitContributions"]
                  ),
                  (
                      "PRs criados",
                      contributions["totalPullRequestContributions"]
                  ),
                  (
                      "Reviews enviados",
                      contributions["totalPullRequestReviewContributions"]
                  ),
                  ("Merges por voce", merged_by_you),
                  (
                      "Issues abertas",
                      contributions["totalIssueContributions"]
                  ),
                  (
                      "Repos com commits",
                      contributions[
                          "totalRepositoriesWithContributedCommits"
                      ]
                  )
              ],
              "activity.svg"
          )

          # --------------------------------------------------
          # 4. Linguagens em formato horizontal
          # --------------------------------------------------

          language_totals = {}
          repos_included = 0
          skipped = 0

          for repo in repos:
              full_name = repo["full_name"]

              try:
                  commits = get(
                      f"{API}/repos/{full_name}/commits",
                      {
                          "author": login,
                          "per_page": 1
                      }
                  )

                  if not commits:
                      continue

                  languages = get(
                      f"{API}/repos/{full_name}/languages"
                  )

                  if not languages:
                      continue

                  repos_included += 1

                  for language, byte_count in languages.items():
                      language_totals[language] = (
                          language_totals.get(language, 0)
                          + byte_count
                      )

              except requests.HTTPError as error:
                  status = error.response.status_code

                  if status == 409:
                      print(f"Sem historico consultavel: {full_name}")
                      continue

                  skipped += 1
                  print(f"Aviso HTTP {status}: {full_name}")

              except requests.RequestException as error:
                  skipped += 1
                  print(f"Aviso de conexao em {full_name}: {error}")

          draw_languages(language_totals, "top-langs.svg")

          print(f"Repos analisados para linguagens: {repos_included}")
          print(f"Outros erros de linguagens: {skipped}")
          print("Todos os cards foram gerados.")
          PY

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/activity.svg profile/top-langs.svg

          if ! git diff --cached --quiet; then
            git commit -m "chore: redesign GitHub profile cards"
            git push
          fi
